name: 🐛 Bug report
description: Report a bug or unexpected behavior
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! 🙏

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open cleanip.exe
        2. Set preset to Deep
        3. Click Start Scan
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g. Windows 11, Ubuntu 22.04, macOS 14
    validations:
      required: true

  - type: dropdown
    id: xray
    attributes:
      label: Is Xray present?
      options:
        - "Yes (xray_core/xray.exe)"
        - "Yes (in PATH)"
        - "No"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Screenshots / Logs
      description: Drag and drop images or paste relevant output
    validations:
      required: false
